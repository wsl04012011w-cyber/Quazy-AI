name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build arm64-v8a APK (Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components and Vulkan shader tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers spirv-tools

      - name: Locate SPIRV-Headers CMake package
        shell: bash
        run: |
          set -euxo pipefail
          SPIRV_CONFIG="$(dpkg -L spirv-headers | grep -E '/SPIRV-HeadersConfig.cmake$' | head -n 1 || true)"
          if [ -z "$SPIRV_CONFIG" ]; then
            SPIRV_CONFIG="$(dpkg -L spirv-headers | grep -E '/spirv_headersConfig.cmake$' | head -n 1 || true)"
          fi
          if [ -z "$SPIRV_CONFIG" ]; then
            echo "SPIRV-Headers CMake package not found in spirv-headers package"
            dpkg -L spirv-headers
            exit 1
          fi
          echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CONFIG")" >> "$GITHUB_ENV"
          echo "Using SPIRV-Headers from $(dirname "$SPIRV_CONFIG")"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quazy-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
